<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Таймер для учёбы</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; --page: #171d1a; --text: #edf3ef; --card: #252e29; --border: #3c4b42; --muted: #a6c2b3; --hint: #b4c3ba; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--page); color: var(--text); font-family: system-ui, sans-serif; }
    main { width: min(100%, 440px); padding: 56px 32px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 28px; box-shadow: 0 18px 60px #263a2910; }
    .label { margin: 0; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font-size: 28px; }
    .hint { margin: 0; color: var(--hint); }
    #time { margin: 40px 0; font-size: clamp(72px, 19vw, 112px); font-weight: 650; line-height: 1; letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
    .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
    button { padding: 14px 20px; border: 0; border-radius: 14px; background: #3e6f5a; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #315c49; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible { outline: 3px solid #a7cbbb; outline-offset: 4px; }
    #status { min-height: 1.5em; margin: 18px 0 0; color: var(--muted); }
    .sounds { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 24px; color: var(--muted); }
    .sounds select { max-width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); font: inherit; }
    .sounds input { width: 90px; accent-color: #3e6f5a; }
    .stats { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); }
    .stats h2 { margin: 0 0 8px; font-size: 18px; }
    .stats p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <p class="label">Время сосредоточиться</p>
    <h1>Таймер для учёбы</h1>
    <p class="hint">25 минут для ваших задач</p>
    <div id="time" role="timer" aria-label="Оставшееся время">25:00</div>
    <div class="controls">
      <button id="start" type="button">Старт</button>
      <button id="pause" type="button" disabled>Пауза</button>
      <button id="reset" type="button">Сброс</button>
      <button id="break" type="button" hidden>Перерыв 5 минут</button>
      <button id="study" type="button" hidden>Вернуться к учёбе</button>
    </div>
    <p id="status" role="status"></p>
    <div class="sounds">
      <label for="sound">Фоновый звук</label>
      <select id="sound">
        <option value="off">Выключен</option>
        <option value="brown">Глубокий шум</option>
        <option value="soft">Мягкий шум</option>
        <option value="air">Тихий воздушный шум</option>
        <option value="hum">Низкое гудение</option>
        <option value="ambient">Спокойный аккорд</option>
      </select>
      <label for="volume">Громкость</label>
      <input id="volume" type="range" min="0" max="100" value="30">
    </div>
    <section class="stats" aria-labelledby="stats-title">
      <h2 id="stats-title">Статистика за неделю</h2>
      <p id="weekly-stats" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const soundSelect = document.getElementById('sound');
    const volumeControl = document.getElementById('volume');
    let audioContext;
    let soundSources = [];
    let soundGain;
    let soundRequest = 0;

    function stopSound() {
      if (soundGain && audioContext) {
        const now = audioContext.currentTime;
        soundGain.gain.cancelScheduledValues(now);
        soundGain.gain.setTargetAtTime(0, now, 0.04);
        soundSources.forEach(source => source.stop(now + 0.25));
      }
      soundSources = [];
      soundGain = null;
    }

    soundSelect.addEventListener('change', async () => {
      const request = ++soundRequest;
      stopSound();
      if (soundSelect.value === 'off') return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) throw new Error('Audio unavailable');
        audioContext ||= new AudioContext();
        await audioContext.resume();
        // Ignore a selection that changed while the audio context was starting.
        if (request !== soundRequest) return;
        soundGain = audioContext.createGain();
        soundGain.gain.setValueAtTime(0, audioContext.currentTime);
        soundGain.gain.setTargetAtTime(Number(volumeControl.value) / 100 * 0.12, audioContext.currentTime, 0.15);
        soundGain.connect(audioContext.destination);
        const choice = soundSelect.value;
        if (choice === 'hum' || choice === 'ambient') {
          const frequencies = choice === 'hum' ? [110, 110.5] : [130.81, 164.81, 196];
          frequencies.forEach(frequency => {
            const oscillator = audioContext.createOscillator();
            const voiceGain = audioContext.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.value = frequency;
            voiceGain.gain.value = 1 / frequencies.length;
            oscillator.connect(voiceGain).connect(soundGain);
            soundSources.push(oscillator);
            oscillator.start();
          });
        } else {
          const noise = audioContext.createBuffer(1, audioContext.sampleRate * 8, audioContext.sampleRate);
          const samples = noise.getChannelData(0);
          for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
          const source = audioContext.createBufferSource();
          const filter = audioContext.createBiquadFilter();
          source.buffer = noise;
          source.loop = true;
          filter.type = 'lowpass';
          filter.frequency.value = { brown: 180, soft: 550, air: 1100 }[choice];
          source.connect(filter).connect(soundGain);
          soundSources.push(source);
          source.start();
        }
      } catch (_) {
        if (request !== soundRequest) return;
        stopSound();
        soundSelect.value = 'off';
        document.getElementById('status').textContent = 'Не удалось включить фоновый звук.';
      }
    });

    volumeControl.addEventListener('input', () => {
      if (!soundGain || soundSelect.value === 'off') return;
      soundGain.gain.setTargetAtTime(Number(volumeControl.value) / 100 * 0.12, audioContext.currentTime, 0.04);
    });

    const studyDuration = 25 * 60 * 1000;
    const breakDuration = 5 * 60 * 1000;
    let duration = studyDuration;
    const display = document.getElementById('time');
    const button = document.getElementById('start');
    const pause = document.getElementById('pause');
    const reset = document.getElementById('reset');
    const status = document.getElementById('status');
    const breakButton = document.getElementById('break');
    const studyButton = document.getElementById('study');
    const hint = document.querySelector('.hint');
    const weeklyStats = document.getElementById('weekly-stats');
    const statsKey = 'timer-pomodoros';
    let completedPomodoros = [];
    let storageAvailable = true;
    try {
      const saved = JSON.parse(localStorage.getItem(statsKey) || '[]');
      if (Array.isArray(saved)) completedPomodoros = saved.filter(value => typeof value === 'number' && Number.isFinite(value));
    } catch (_) { storageAvailable = false; }

    function renderStats() {
      const now = new Date();
      const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      weekStart.setDate(weekStart.getDate() - (weekStart.getDay() + 6) % 7);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekEnd.getDate() + 7);
      const count = completedPomodoros.filter(time => time >= weekStart.getTime() && time < weekEnd.getTime()).length;
      weeklyStats.textContent = `Завершено помодоров с понедельника: ${count}` + (storageAvailable ? '' : ' (сохранение в браузере недоступно)');
    }

    function recordPomodoro() {
      completedPomodoros.push(Date.now());
      try { localStorage.setItem(statsKey, JSON.stringify(completedPomodoros)); }
      catch (_) { storageAvailable = false; }
      renderStats();
    }

    renderStats();
    window.addEventListener('focus', renderStats);
    let deadline = 0;
    let interval = null;
    let remaining = duration;

    function render() {
      const seconds = Math.ceil(remaining / 1000);
      display.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function update() {
      remaining = Math.max(0, deadline - Date.now());
      render();
      if (remaining === 0) {
        clearInterval(interval);
        interval = null;
        button.disabled = false;
        pause.disabled = true;
        button.textContent = 'Начать заново';
        if (duration === studyDuration) {
          recordPomodoro();
          status.textContent = 'Время вышло! Выберите перерыв или начните учёбу заново.';
          breakButton.hidden = false;
        } else {
          status.textContent = 'Перерыв закончился!';
        }
      }
    }

    button.addEventListener('click', () => {
      if (interval !== null) return;
      if (remaining === 0) remaining = duration;
      breakButton.hidden = true;
      deadline = Date.now() + remaining;
      status.textContent = 'Таймер запущен';
      button.disabled = true;
      pause.disabled = false;
      update();
      interval = setInterval(update, 250);
    });

    pause.addEventListener('click', () => {
      update();
      if (interval === null) return;
      clearInterval(interval);
      interval = null;
      button.disabled = false;
      button.textContent = 'Продолжить';
      pause.disabled = true;
      status.textContent = 'Таймер на паузе';
    });

    reset.addEventListener('click', () => {
      clearInterval(interval);
      interval = null;
      remaining = duration;
      render();
      button.disabled = false;
      button.textContent = 'Старт';
      pause.disabled = true;
      status.textContent = '';
      breakButton.hidden = true;
    });

    breakButton.addEventListener('click', () => {
      duration = breakDuration;
      reset.click();
      hint.textContent = '5 минут отдыха';
      breakButton.hidden = true;
      studyButton.hidden = false;
      button.click();
    });

    studyButton.addEventListener('click', () => {
      duration = studyDuration;
      reset.click();
      hint.textContent = '25 минут для ваших задач';
      breakButton.hidden = true;
      studyButton.hidden = true;
    });
  </script>
</body>
</html>
