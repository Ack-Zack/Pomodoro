<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Таймер для учёбы</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; --page: #f5f3ee; --text: #252d29; --card: #fff; --border: #e8eae4; --muted: #668075; --hint: #7b8780; }
    :root[data-theme="dark"] { color-scheme: dark; --page: #171d1a; --text: #edf3ef; --card: #252e29; --border: #3c4b42; --muted: #a6c2b3; --hint: #b4c3ba; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--page); color: var(--text); font-family: system-ui, sans-serif; }
    main { width: min(100%, 440px); padding: 56px 32px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 28px; box-shadow: 0 18px 60px #263a2910; }
    .label { margin: 0; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font-size: 28px; }
    .hint { margin: 0; color: var(--hint); }
    #time { margin: 40px 0; font-size: clamp(72px, 19vw, 112px); font-weight: 650; line-height: 1; letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
    .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
    button { padding: 14px 20px; border: 0; border-radius: 14px; background: #3e6f5a; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #315c49; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible { outline: 3px solid #a7cbbb; outline-offset: 4px; }
    #status { min-height: 1.5em; margin: 18px 0 0; color: var(--muted); }
    #theme { margin-top: 16px; background: transparent; color: var(--muted); border: 1px solid var(--border); }
    #theme:hover { background: var(--border); }
  </style>
</head>
<body>
  <main>
    <p class="label">Время сосредоточиться</p>
    <h1>Таймер для учёбы</h1>
    <p class="hint">25 минут для ваших задач</p>
    <div id="time" role="timer" aria-label="Оставшееся время">25:00</div>
    <div class="controls">
      <button id="start" type="button">Старт</button>
      <button id="pause" type="button" disabled>Пауза</button>
      <button id="reset" type="button">Сброс</button>
      <button id="break" type="button" hidden>Перерыв 5 минут</button>
      <button id="study" type="button" hidden>Вернуться к учёбе</button>
    </div>
    <p id="status" role="status"></p>
    <button id="theme" type="button">Тёмная тема</button>
  </main>
  <script>
    const themeButton = document.getElementById('theme');
    let savedTheme;
    try { savedTheme = localStorage.getItem('timer-theme'); } catch (_) { /* Storage may be unavailable. */ }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeButton.textContent = theme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
    }

    setTheme(savedTheme === 'dark' ? 'dark' : 'light');
    themeButton.addEventListener('click', () => {
      const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      setTheme(theme);
      try { localStorage.setItem('timer-theme', theme); } catch (_) { /* Keep the choice for this session. */ }
    });

    const studyDuration = 25 * 60 * 1000;
    const breakDuration = 5 * 60 * 1000;
    let duration = studyDuration;
    const display = document.getElementById('time');
    const button = document.getElementById('start');
    const pause = document.getElementById('pause');
    const reset = document.getElementById('reset');
    const status = document.getElementById('status');
    const breakButton = document.getElementById('break');
    const studyButton = document.getElementById('study');
    const hint = document.querySelector('.hint');
    let deadline = 0;
    let interval = null;
    let remaining = duration;

    function render() {
      const seconds = Math.ceil(remaining / 1000);
      display.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function update() {
      remaining = Math.max(0, deadline - Date.now());
      render();
      if (remaining === 0) {
        clearInterval(interval);
        interval = null;
        button.disabled = false;
        pause.disabled = true;
        button.textContent = 'Начать заново';
        if (duration === studyDuration) {
          status.textContent = 'Время вышло! Выберите перерыв или начните учёбу заново.';
          breakButton.hidden = false;
        } else {
          status.textContent = 'Перерыв закончился!';
        }
      }
    }

    button.addEventListener('click', () => {
      if (interval !== null) return;
      if (remaining === 0) remaining = duration;
      breakButton.hidden = true;
      deadline = Date.now() + remaining;
      status.textContent = 'Таймер запущен';
      button.disabled = true;
      pause.disabled = false;
      update();
      interval = setInterval(update, 250);
    });

    pause.addEventListener('click', () => {
      update();
      if (interval === null) return;
      clearInterval(interval);
      interval = null;
      button.disabled = false;
      button.textContent = 'Продолжить';
      pause.disabled = true;
      status.textContent = 'Таймер на паузе';
    });

    reset.addEventListener('click', () => {
      clearInterval(interval);
      interval = null;
      remaining = duration;
      render();
      button.disabled = false;
      button.textContent = 'Старт';
      pause.disabled = true;
      status.textContent = '';
      breakButton.hidden = true;
    });

    breakButton.addEventListener('click', () => {
      duration = breakDuration;
      reset.click();
      hint.textContent = '5 минут отдыха';
      breakButton.hidden = true;
      studyButton.hidden = false;
      button.click();
    });

    studyButton.addEventListener('click', () => {
      duration = studyDuration;
      reset.click();
      hint.textContent = '25 минут для ваших задач';
      breakButton.hidden = true;
      studyButton.hidden = true;
    });
  </script>
</body>
</html>
